<svg viewBox="0 0 680 580" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>PyTorch 编译栈组件到 Lowering 层次的映射</title>
  <desc>展示 Dynamo、Inductor、CUDAGraph、TorchAir、GE、aclnn 各自落在编译栈的哪个位置</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .th { font: 500 14px sans-serif; fill: #2C2C2A; }
    .ts { font: 400 12px sans-serif; fill: #5F5E5A; }
    .caption { font: 400 11px sans-serif; fill: #888780; }
    .tag { font: 500 11px sans-serif; }
  </style>

  <!-- Layer 0: Python Frontend -->
  <rect x="40" y="20" width="600" height="52" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Python Frontend (eager mode)</text>
  <text class="caption" x="340" y="60" text-anchor="middle" dominant-baseline="central">用户写的 PyTorch 代码</text>

  <!-- Arrow: capture -->
  <line x1="340" y1="72" x2="340" y2="98" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="caption" x="355" y="90">capture</text>

  <!-- Layer 1: Graph Capture -->
  <rect x="40" y="100" width="600" height="56" rx="12" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="200" y="122" text-anchor="middle" dominant-baseline="central">Graph Capture 层</text>
  <text class="ts" x="200" y="140" text-anchor="middle" dominant-baseline="central">Python → FX Graph</text>
  <!-- Dynamo tag -->
  <rect x="400" y="108" width="160" height="36" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text class="tag" x="480" y="130" text-anchor="middle" dominant-baseline="central" fill="#3C3489">TorchDynamo</text>

  <!-- Arrow: Graph Lowering -->
  <line x1="340" y1="156" x2="340" y2="190" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="caption" x="355" y="178">Graph Lowering</text>

  <!-- Layer 2: Graph Optimization -->
  <rect x="40" y="192" width="600" height="56" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="th" x="200" y="214" text-anchor="middle" dominant-baseline="central">Graph Optimization 层</text>
  <text class="ts" x="200" y="232" text-anchor="middle" dominant-baseline="central">Fusion 决策 + 算子选择</text>
  <!-- TorchAir tag -->
  <rect x="380" y="198" width="120" height="32" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text class="tag" x="440" y="218" text-anchor="middle" dominant-baseline="central" fill="#0C447C">TorchAir</text>
  <!-- GE tag -->
  <rect x="510" y="198" width="100" height="32" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text class="tag" x="560" y="218" text-anchor="middle" dominant-baseline="central" fill="#0C447C">GE</text>

  <!-- Split indicator -->
  <line x1="340" y1="248" x2="340" y2="370" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="caption" x="170" y="258" text-anchor="middle">NVIDIA 路径</text>
  <text class="caption" x="510" y="258" text-anchor="middle">Ascend 路径</text>

  <!-- Left path: Inductor -->
  <rect x="60" y="270" width="250" height="56" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="185" y="290" text-anchor="middle" dominant-baseline="central">Operator + Tile Level</text>
  <text class="ts" x="185" y="308" text-anchor="middle" dominant-baseline="central">Fusion + Tiling + 内存规划</text>
  <rect x="115" y="330" width="140" height="30" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="tag" x="185" y="349" text-anchor="middle" dominant-baseline="central" fill="#085041">TorchInductor</text>

  <!-- Right path: aclnn + GE -->
  <rect x="370" y="270" width="250" height="56" rx="12" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text class="th" x="495" y="290" text-anchor="middle" dominant-baseline="central">Operator Library + Tiling</text>
  <text class="ts" x="495" y="308" text-anchor="middle" dominant-baseline="central">预编译算子 + GE Tiling</text>
  <rect x="405" y="330" width="100" height="30" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text class="tag" x="455" y="349" text-anchor="middle" dominant-baseline="central" fill="#712B13">aclnn</text>
  <rect x="515" y="330" width="100" height="30" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text class="tag" x="565" y="349" text-anchor="middle" dominant-baseline="central" fill="#712B13">GE Tiling</text>

  <!-- Arrow: Codegen -->
  <line x1="185" y1="360" x2="185" y2="400" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="caption" x="200" y="384">Codegen → Triton</text>
  <line x1="495" y1="360" x2="495" y2="400" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="caption" x="510" y="384">Codegen → Ascend ISA</text>

  <!-- Bottom: Hardware -->
  <rect x="60" y="402" width="250" height="50" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text class="th" x="185" y="420" text-anchor="middle" dominant-baseline="central">GPU Kernel 执行</text>
  <text class="ts" x="185" y="438" text-anchor="middle" dominant-baseline="central">PTX / SASS</text>

  <rect x="370" y="402" width="250" height="50" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text class="th" x="495" y="420" text-anchor="middle" dominant-baseline="central">NPU Kernel 执行</text>
  <text class="ts" x="495" y="438" text-anchor="middle" dominant-baseline="central">Ascend Binary</text>

  <!-- CUDAGraph: Runtime overlay -->
  <rect x="60" y="470" width="560" height="50" rx="12" fill="#FBEAF0" stroke="#ED93B1" stroke-width="0.5" stroke-dasharray="6 3"/>
  <text class="th" x="340" y="488" text-anchor="middle" dominant-baseline="central">Runtime 层 (不在 Lowering 链内)</text>
  <text class="ts" x="340" y="506" text-anchor="middle" dominant-baseline="central">CUDAGraph: 图捕获重放，减少 launch overhead</text>

  <!-- Legend -->
  <line x1="60" y1="545" x2="90" y2="545" stroke="#ED93B1" stroke-width="0.5" stroke-dasharray="6 3"/>
  <text class="caption" x="95" y="549">虚线框 = 运行时优化，不参与编译期 Lowering</text>
</svg>